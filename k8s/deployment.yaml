apiVersion: apps/v1
kind: Deployment
metadata:
  name: museum-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: museum-api
  template:
    metadata:
      labels:
        app: museum-api
    spec:
      containers:
        - name: museum-api
          image: arijengineer/museum-api:1.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: museum-api-config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false